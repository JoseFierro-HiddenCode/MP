<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: false
});


// ============================================================
// CONFIGURACIÓN
// ============================================================

const DRAW_TIME = 9000;

const RAYS = 1100;

const PATH_POINTS = 6000;

// Rojo del corazón
const RED = "#ff1744";


// ============================================================
// VARIABLES
// ============================================================

let W = 0;
let H = 0;
let DPR = 1;

let scale = 1;

let startTime = performance.now();


// ============================================================
// RESIZE
// ============================================================

function resize() {

    DPR = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

    scale = Math.min(W, H) / 38;
}

window.addEventListener(
    "resize",
    resize
);

resize();


// ============================================================
// CORAZÓN MATEMÁTICO
// ============================================================

function heartX(t) {

    return 16 * Math.pow(
        Math.sin(t),
        3
    );

}


function heartY(t) {

    return -(
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
    );

}


// ============================================================
// CONSTRUIR TRAYECTORIA
// ============================================================

const path = [];

let totalDistance = 0;

let previousX = 0;
let previousY = 0;


for (
    let i = 0;
    i <= PATH_POINTS;
    i++
) {

    const t =
        (Math.PI * 2 * i) /
        PATH_POINTS;


    const x =
        heartX(t);

    const y =
        heartY(t);


    if (i > 0) {

        const dx =
            x - previousX;

        const dy =
            y - previousY;


        totalDistance +=
            Math.sqrt(
                dx * dx +
                dy * dy
            );
    }


    path.push({
        t: t,
        distance: totalDistance
    });


    previousX = x;
    previousY = y;
}


// ============================================================
// DISTANCIA → T
// ============================================================

function distanceToT(distance) {

    let low = 0;
    let high = PATH_POINTS;


    while (low < high) {

        const middle =
            (low + high) >> 1;


        if (
            path[middle].distance <
            distance
        ) {

            low =
                middle + 1;

        } else {

            high =
                middle;
        }
    }


    const index =
        Math.min(
            low,
            PATH_POINTS
        );


    return path[index].t;
}


// ============================================================
// PUNTO DEL CORAZÓN
// ============================================================

function getPoint(t) {

    return {

        x:
            W / 2 +
            heartX(t) *
            scale,

        y:
            H / 2 +
            heartY(t) *
            scale
    };
}


// ============================================================
// VELOCIDAD
//
// La animación tiene 3 zonas:
//
// 0 → 45%
// un poco más rápida
//
// 45 → 55%
// baja suavemente
//
// 55 → 100%
// vuelve a acelerar progresivamente
//
// Todo mediante curvas suaves.
// ============================================================

function smooth(t) {

    return (
        t * t *
        (3 - 2 * t)
    );
}


function animationProgress(time) {

    let p =
        Math.min(
            1,
            Math.max(
                0,
                time / DRAW_TIME
            )
        );


    if (p < 0.45) {

        const local =
            p / 0.45;

        return (
            smooth(local) *
            0.45
        );
    }


    if (p < 0.55) {

        const local =
            (p - 0.45) /
            0.10;

        return (
            0.45 +
            smooth(local) *
            0.08
        );
    }


    const local =
        (p - 0.55) /
        0.45;


    return (
        0.53 +
        smooth(local) *
        0.47
    );
}


// ============================================================
// CORAZÓN PRECALCULADO
//
// En vez de calcular las 1100 líneas cada frame,
// las dejamos preparadas en memoria.
// Esto hace la animación mucho más fluida.
// ============================================================

const rays = [];

for (
    let i = 0;
    i < RAYS;
    i++
) {

    const t =
        (Math.PI * 2 * i) /
        RAYS;


    const px =
        heartX(t);

    const py =
        heartY(t);


    rays.push({
        x: px,
        y: py,
        t: t
    });
}


// ============================================================
// DIBUJAR CORAZÓN
// ============================================================

function drawHeart(progress) {

    const visible =
        Math.floor(
            RAYS * progress
        );


    const cx = W / 2;
    const cy = H / 2;


    ctx.beginPath();


    for (
        let i = 0;
        i < visible;
        i++
    ) {

        const point =
            rays[i];


        const x =
            cx +
            point.x *
            scale;


        const y =
            cy +
            point.y *
            scale;


        ctx.moveTo(
            cx,
            cy
        );

        ctx.lineTo(
            x,
            y
        );
    }


    ctx.strokeStyle =
        RED;

    ctx.lineWidth =
        0.72;

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    ctx.shadowColor =
        "rgba(255,23,68,0.35)";

    ctx.shadowBlur =
        2;


    ctx.stroke();

    ctx.shadowBlur = 0;
}


// ============================================================
// CORAZONCITO TRAZADOR
// ============================================================

function drawTracer(t, time) {

    const p =
        getPoint(t);


    const next =
        getPoint(
            t + 0.012
        );


    const angle =
        Math.atan2(
            next.y - p.y,
            next.x - p.x
        );


    /*
        Pequeño movimiento orgánico.
    */

    const float =
        Math.sin(
            time * 0.006
        ) * 0.7;


    const size =
        scale *
        0.12;


    ctx.save();


    ctx.translate(
        p.x,
        p.y + float
    );


    ctx.rotate(
        angle +
        Math.PI / 2
    );


    ctx.beginPath();


    ctx.moveTo(
        0,
        size * 0.9
    );


    ctx.bezierCurveTo(
        -size * 1.35,
        size * 0.15,
        -size * 1.05,
        -size,
        0,
        -size * 0.32
    );


    ctx.bezierCurveTo(
        size * 1.05,
        -size,
        size * 1.35,
        size * 0.15,
        0,
        size * 0.9
    );


    ctx.fillStyle =
        RED;

    ctx.shadowColor =
        RED;

    ctx.shadowBlur =
        10;


    ctx.fill();


    ctx.restore();
}


// ============================================================
// MARIPOSA
//
// Muy pequeña y suave.
// ============================================================

function drawButterfly(
    x,
    y,
    angle,
    time
) {

    const size =
        scale * 0.22;


    const flap =
        0.78 +
        Math.abs(
            Math.sin(
                time * 0.012
            )
        ) * 0.22;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(angle);


    // Ala izquierda

    ctx.save();

    ctx.scale(
        flap,
        1
    );


    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(
        -size * 0.6,
        -size,
        -size * 1.2,
        -size * 0.45,
        -size * 0.45,
        size * 0.15
    );

    ctx.bezierCurveTo(
        -size * 0.2,
        size * 0.4,
        0,
        size * 0.15,
        0,
        0
    );


    ctx.fillStyle =
        "rgba(255,23,68,0.18)";

    ctx.strokeStyle =
        "rgba(255,80,100,0.55)";

    ctx.lineWidth =
        0.55;

    ctx.fill();
    ctx.stroke();

    ctx.restore();


    // Ala derecha

    ctx.save();

    ctx.scale(
        -flap,
        1
    );


    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(
        -size * 0.6,
        -size,
        -size * 1.2,
        -size * 0.45,
        -size * 0.45,
        size * 0.15
    );

    ctx.bezierCurveTo(
        -size * 0.2,
        size * 0.4,
        0,
        size * 0.15,
        0,
        0
    );


    ctx.fillStyle =
        "rgba(255,23,68,0.18)";

    ctx.strokeStyle =
        "rgba(255,80,100,0.55)";

    ctx.lineWidth =
        0.55;

    ctx.fill();
    ctx.stroke();

    ctx.restore();


    // Cuerpo

    ctx.beginPath();

    ctx.moveTo(
        0,
        -size * 0.35
    );

    ctx.lineTo(
        0,
        size * 0.45
    );

    ctx.strokeStyle =
        "#ff6075";

    ctx.lineWidth =
        0.8;

    ctx.stroke();


    ctx.restore();
}


// ============================================================
// ANIMACIÓN
// ============================================================

function animate(timestamp) {

    const elapsed =
        timestamp -
        startTime;


    /*
        Fondo negro.
    */

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // --------------------------------------------------------
    // PROGRESO
    // --------------------------------------------------------

    const progress =
        animationProgress(
            elapsed
        );


    // --------------------------------------------------------
    // CORAZÓN
    // --------------------------------------------------------

    if (progress < 1) {

        drawHeart(
            progress
        );


        // ----------------------------------------------------
        // CORAZONCITO TRAZADOR
        // ----------------------------------------------------

        const distance =
            totalDistance *
            progress;


        const t =
            distanceToT(
                distance
            );


        drawTracer(
            t,
            elapsed
        );


        // ----------------------------------------------------
        // MARIPOSA
        //
        // La colocamos detrás del trazador.
        // ----------------------------------------------------

        const butterflyDistance =
            totalDistance *
            Math.max(
                0,
                progress - 0.025
            );


        const butterflyT =
            distanceToT(
                butterflyDistance
            );


        const bp =
            getPoint(
                butterflyT
            );


        const bp2 =
            getPoint(
                butterflyT + 0.015
            );


        const direction =
            Math.atan2(
                bp2.y - bp.y,
                bp2.x - bp.x
            );


        const side =
            Math.sin(
                elapsed * 0.002
            );


        const bx =
            bp.x +
            Math.cos(
                direction + Math.PI / 2
            ) *
            scale *
            (1.1 + side * 0.15);


        const by =
            bp.y +
            Math.sin(
                direction + Math.PI / 2
            ) *
            scale *
            (1.1 + side * 0.15);


        drawButterfly(
            bx,
            by,
            direction,
            elapsed
        );

    }

    else {

        // ----------------------------------------------------
        // CORAZÓN TERMINADO
        // ----------------------------------------------------

        const after =
            (
                elapsed -
                DRAW_TIME
            ) / 1000;


        /*
            Latido MUY sutil.
        */

        const pulse =
            1 +
            Math.sin(
                after *
                Math.PI *
                2
            ) *
            0.012;


        ctx.save();


        ctx.translate(
            W / 2,
            H / 2
        );


        ctx.scale(
            pulse,
            pulse
        );


        ctx.translate(
            -W / 2,
            -H / 2
        );


        drawHeart(1);


        ctx.restore();
    }


    requestAnimationFrame(
        animate
    );
}


// ============================================================
// INICIAR
// ============================================================

requestAnimationFrame(
    animate
);


// ============================================================
// REINICIAR CON CLICK / TOQUE
// ============================================================

function restart() {

    startTime =
        performance.now();
}


canvas.addEventListener(
    "click",
    restart
);


canvas.addEventListener(
    "touchstart",
    restart,
    {
        passive: true
    }
);

</script>

</body>
</html>
